services:
  backend:
    image: ghcr.io/leguigou/comfyforge-backend:latest
    pull_policy: always
    container_name: comfyforge-backend
    expose:
      - "3001"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/workflows:/app/backend/workflows
      - ./images:/app/images
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - COMFY_URL=${COMFY_URL:-http://host.docker.internal:8188}
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD in .env}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SERVICE_URL_ALLOWLIST=${SERVICE_URL_ALLOWLIST:-}
      - ALLOW_PRIVATE_SERVICE_URLS=${ALLOW_PRIVATE_SERVICE_URLS:-false}
      - ALLOW_USER_LLM_URLS=${ALLOW_USER_LLM_URLS:-false}
      - MAX_QUEUE_PER_USER=${MAX_QUEUE_PER_USER:-25}
      - MAX_QUEUE_BATCH=${MAX_QUEUE_BATCH:-50}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health?dependencies=0').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/leguigou/comfyforge-frontend:latest
    pull_policy: always
    container_name: comfyforge-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

